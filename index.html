<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>STEM Advantage Mixer</title>
</head>
<body>
    <form id="connect-form">
        <img src="assets/STEM-Logo.webp" alt="TIPSE Logo" class="form-logo" />
        <label for="first">First Name:</label>
        <input id="first" type="text" name="first" placeholder="Eddie" required />

        <label for="last">Last Name:</label>
        <input id="last" type="text" name="last" placeholder="Eagle" />

        <label for="cin">CIN:</label>
        <input id="cin" type="text" name="cin" placeholder="12345678" required />

        <label for="email">Preferred Email:</label>
        <input id="email" type="email" name="email" placeholder="edEagle@calstatela.edu" required />

        <label for="experience">How long have you been part of STEM Advantage:</label>
        <input id="experience" required placeholder="first time"/>

        <label for="major">Major:</label>
        <input id="major" type="text" name="major" placeholder="Computer Science" />

        <button type="submit">Thanks for coming!</button>
    </form>

    <script src="js/script.js"></script>

    <footer class="footer">
        <p>Copyright &copy; STEM Advantage 2026</p>
        <p>Mentor. Prepare. Inspire</p>
    </footer>

</body>
</html>
